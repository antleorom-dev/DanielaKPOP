name: Validate Daniela A/B preview
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/character/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build -- --base=/DanielaKPOP/
