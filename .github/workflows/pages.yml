name: Deploy DanielaKPOP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract uploaded game resources
        run: |
          if [ -f public/assets/DanielaKPOP-recursos-v0.4.zip ]; then
            unzip -oq public/assets/DanielaKPOP-recursos-v0.4.zip -d .
          elif [ -f DanielaKPOP-recursos-v0.4.zip ]; then
            unzip -oq DanielaKPOP-recursos-v0.4.zip -d .
          fi
          test -f public/assets/studio-song.mp3 || { echo "ERROR: falta studio-song.mp3 en el paquete"; exit 1; }
          test -f public/assets/Shakira_Burna_Boy_-_Dai_Dai.mp3 || { echo "ERROR: falta Dai Dai en public/assets"; exit 1; }
          test -f public/assets/interior/Bed_King.glb || { echo "ERROR: falta Bed_King.glb en el paquete"; exit 1; }
          echo "Recursos de música y mobiliario listos para el despliegue."
      - name: Generate animated Daniela with free Blender (cloud-only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libopengl0 libglx-mesa0
          mkdir -p public/assets/characters build/character
          blender --background --factory-startup --python-exit-code 1 \
            --python scripts/character/generate_daniela.py -- \
            --output public/assets/characters/daniela-rigged.glb \
            --blend-output build/character/daniela-source.blend
          python3 scripts/character/validate_glb.py \
            public/assets/characters/daniela-rigged.glb \
            --manifest public/assets/characters/daniela-manifest.json
      - name: Generate opt-in original-inspired Daniela A/B model
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python scripts/character/generate_daniela.py -- \
            --variant original-inspired \
            --output public/assets/characters/daniela-original-inspired.glb \
            --blend-output build/character/daniela-original-inspired.blend
          python3 scripts/character/validate_glb.py \
            public/assets/characters/daniela-original-inspired.glb \
            --manifest public/assets/characters/daniela-original-inspired-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: DanielaKPOP-Blender-editable-source
          path: build/character/daniela-source.blend
          retention-days: 14
          if-no-files-found: error
      - run: npm install
      - run: npm run build -- --base=/DanielaKPOP/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
